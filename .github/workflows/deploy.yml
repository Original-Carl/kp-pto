name: Deploy

# Runs when the CI workflow finishes. Deploys to GitHub Pages only if CI
# succeeded on a push to main, and deploys that exact commit. Publishes just the
# public files (scripts/stage-site.mjs); tests, tools, and docs stay out.
# The custom domain (kp-pto.org) is set in repo Settings → Pages, not via a
# CNAME file — Actions-based Pages deployments ignore CNAME files.
# The github-pages environment only accepts deployments from `main` (a custom
# deployment branch policy in Settings → Environments), a second lock on top
# of the `if` below.
#
# After deploying, `smoke` waits until the live version.json reports this
# commit, then runs the phone browser tests against the live site. A red smoke
# run means the site is live but broken: see docs/RUNBOOK.md → Rollback.
#
# SITE_URL: repository variable (Settings → Secrets and variables → Actions →
# Variables), with a trailing slash; defaults to https://kp-pto.org/.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://kp-pto.org/' }}

jobs:
  deploy:
    name: deploy
    # Only after CI passed for a push to main (never for PRs or other branches),
    # and only for the commit that's still main's tip: re-running an old CI or
    # Deploy run must not roll the site back. (For workflow_run, github.sha is
    # main's tip when the run was created; a newer commit's own CI run deploys
    # it.) A re-run keeps its original github.sha, so the first step re-checks
    # main's tip at run time.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse if main has moved on (re-run of an old Deploy run)
        run: |
          tip=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::main is now ${tip:0:7}, not ${GITHUB_SHA:0:7}; deploying this would roll the site back. Re-run the latest Deploy run instead."
            exit 1
          fi
      # The job's `if` and the step above guarantee main's tip (github.sha,
      # checked out by default) is exactly the commit CI tested, so no ref is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Stage public files
        env:
          SITE_COMMIT: ${{ github.sha }}
        run: node scripts/stage-site.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: smoke (live site)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A newer deploy makes an older smoke run moot (its commit is no longer
    # live), so cancel it rather than let it fail.
    concurrency:
      group: smoke
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/ci/package-lock.json
      # GitHub Pages' CDN can serve the old version for a few minutes; this
      # polls version.json for up to 10 minutes (scripts/live-commit.mjs).
      - name: Wait for the live site to serve this commit
        run: node scripts/live-commit.mjs "$SITE_URL" --wait "$GITHUB_SHA"
      - name: Install tools/ci
        working-directory: tools/ci
        run: npm ci --no-fund --no-audit
      - name: Install Chromium
        working-directory: tools/ci
        run: npx playwright install --with-deps chromium
      # BASE_URL makes Playwright test the live site instead of a local _site/.
      - name: Browser tests against the live site (phone)
        working-directory: tools/ci
        env:
          BASE_URL: ${{ env.SITE_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npx playwright test --project=mobile
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report
          path: tools/ci/playwright-report
          retention-days: 14
