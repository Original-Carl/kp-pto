name: Deploy

# Runs when the CI workflow finishes. Deploys to GitHub Pages only if CI
# succeeded on a push to main, and deploys that exact commit. Publishes just the
# public files (scripts/stage-site.mjs); tests, tools, and docs stay out.
# The custom domain (kp-pto.org) is set in repo Settings → Pages, not via a
# CNAME file — Actions-based Pages deployments ignore CNAME files.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    # Only after CI passed for a push to main (never for PRs or other branches),
    # and only for the commit that's still main's tip: re-running an old CI or
    # Deploy run must not roll the site back. (For workflow_run, github.sha is
    # the current tip of main; a newer commit's own CI run deploys it.)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy exactly the commit CI tested, not whatever main is now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Stage public files
        run: node scripts/stage-site.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
